# Decap CMS — the visual editor at /admin
# Local testing: set `local_backend: true` (already on) and run, in two terminals:
#   1) npx decap-server
#   2) npm run dev
# then open http://localhost:3000/admin/index.html — no login needed, posts save locally.
# (Production on Netlify serves it at /admin/.)
#
# Production (Netlify): replace `repo` below with your GitHub "owner/repo".
# Because Netlify Identity is deprecated for new sites, auth uses the GitHub
# backend via an OAuth handler — see README "Going live with the editor".

backend:
  name: github
  repo: nikobutika99/nikosnotes
  branch: main
  base_url: https://nikosnotes.com
  auth_endpoint: /.netlify/functions/auth

# Lets you run the editor against local files during development.
local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

publish_mode: simple

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    summary: '{{title}}  ·  {{category}}'
    sortable_fields: [pubDate, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text, hint: 'One or two sentences shown on cards.' }
      - label: Category
        name: category
        widget: select
        options: [Finance, Economy, Technology, Energy, Sports, Literature, Other]
        default: Technology
      - { label: 'Publish date', name: pubDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { label: 'Cover image', name: cover, widget: image, required: false, hint: 'Optional. A nice 16:10 image works best.' }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: 'Feature on homepage', name: featured, widget: boolean, default: false }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: 'Drafts are hidden on the live site.' }
      - { label: Body, name: body, widget: markdown }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [pubDate, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text }
      - { label: 'Tech / stack', name: stack, widget: list, required: false, default: [] }
      - { label: 'Project link', name: link, widget: string, required: false, hint: 'Full URL (https://…) — optional.' }
      - { label: 'Publish date', name: pubDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { label: 'Cover image', name: cover, widget: image, required: false }
      - { label: 'Feature on homepage', name: featured, widget: boolean, default: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: media
    label: Media
    label_singular: Media post
    folder: src/content/media
    create: true
    slug: '{{slug}}'
    summary: '{{title}}  ·  {{pubDate}}'
    sortable_fields: [pubDate, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text, hint: 'One or two sentences shown on the card.' }
      - { label: 'Event date', name: pubDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - label: Photos
        name: images
        widget: list
        label_singular: Photo
        summary: '{{fields.caption}}'
        # No `min: 1`: tested, Decap 3.17 still publishes an empty list. The
        # schema tolerates zero photos and the post page shows a notice instead.
        fields:
          # USER DATA / PRIVACY: phone photos embed GPS location and device info.
          # media_processing re-encodes each upload in the browser (JPEG, PNG and
          # WebP only), which drops that metadata, and shrinks it to a 1600px-wide
          # WebP to save bandwidth and repo space. iPhone HEIC files are NOT
          # processed and would upload full size WITH location: use JPEG instead.
          # Limitation: `width` is an exact width, so smaller images get enlarged.
          - label: Photo
            name: src
            widget: image
            hint: 'JPEG or PNG. Shrunk to 1600px WebP on upload, location data removed. Not iPhone HEIC.'
            media_processing:
              enabled: true
              format: { enabled: true, default: webp }
              quality: 80
              width: 1600
              strip_metadata: true
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: Description, name: body, widget: markdown, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: 'Drafts are hidden on the live site.' }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About Page
        file: src/data/about.json
        description: 'Your About page — bio, photo, experience, education, skills, hobbies, certifications.'
        fields:
          - { label: 'Profile photo', name: portrait, widget: image, required: false, hint: 'Square photo works best. Updates the About page and sidebar.' }
          - { label: Headline, name: headline, widget: string, hint: "e.g. \"Hi, I'm Niko.\"" }
          - { label: 'LinkedIn URL', name: linkedin, widget: string, required: false, hint: 'Full URL to your profile, e.g. https://www.linkedin.com/in/username. Leave blank to hide the icon.' }
          - { label: Story, name: story, widget: text, hint: 'A short bio. Separate paragraphs with a blank line.' }
          - label: Experience
            name: experience
            widget: list
            label_singular: Role
            summary: '{{fields.role}} — {{fields.org}}'
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Organization, name: org, widget: string }
              - { label: Period, name: period, widget: string, hint: 'e.g. 2022 — Present' }
              - { label: Details, name: detail, widget: text }
          - label: Education
            name: education
            widget: list
            label_singular: Qualification
            summary: '{{fields.degree}} — {{fields.school}}'
            fields:
              - { label: Degree, name: degree, widget: string }
              - { label: School, name: school, widget: string }
              - { label: Period, name: period, widget: string }
              - { label: Details, name: detail, widget: text }
          - { label: Skills, name: skills, widget: list, hint: 'Add one skill per item.' }
          - { label: Hobbies, name: hobbies, widget: list, hint: 'Add one hobby per item.' }
          - label: Certifications
            name: certifications
            widget: list
            label_singular: Certification
            summary: '{{fields.title}}'
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Issuer, name: issuer, widget: string }
              - { label: Year, name: year, widget: string }
